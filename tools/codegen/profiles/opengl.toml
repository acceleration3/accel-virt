# Commands whose two sides are written by hand. The generated code
# declares them and routes to them; it does not define them.
handwritten = []

# Commands the guest answers without asking.
#
# glGetError is a query, so it was a blocking round trip, and an
# application asks after everything: SuperTuxKart asks eleven times a
# frame, which came to 14,537 round trips and 5,929 ms of a benchmark —
# more than anything else in the guest. It does not need the wire. The
# server is the only side that can see an error, it already reads them
# as it replays, and reading is what clears them, so the guest's error
# queue is a word in the shared region that the server publishes into
# and the guest takes from. See RegionHeader::gl_error.
#
# The definition is in gl_helpers.cpp.
answered_by_guest = ["glGetError"]

# What the guest driver implements rather than carries.
#
# These are excluded above — a pointer is an address the host has never
# seen, and a mapping is a shadow copy in the guest — but the
# application still gets a working entry point, so an extension that
# needs one is an extension this driver can offer. Naming them here is
# what keeps the two facts from disagreeing.
driver_implemented = [
    # The direct-state-access spellings the guest answers itself. An
    # extension is claimed only when every command it needs is answered,
    # and these are answered here rather than on the wire.
    "glMapNamedBufferEXT",
    "glMapNamedBufferRangeEXT",
    "glUnmapNamedBufferEXT",
    "glFlushMappedNamedBufferRangeEXT",
    "glGetNamedBufferPointervEXT",
    "glGetPointerIndexedvEXT",
    "glGetPointeri_vEXT",
    "glGetVertexArrayPointervEXT",
    "glGetVertexArrayPointeri_vEXT",

    "glMapBuffer", "glMapBufferRange", "glUnmapBuffer",
    "glFlushMappedBufferRange", "glMapNamedBuffer", "glMapNamedBufferRange",
    "glUnmapNamedBuffer", "glFlushMappedNamedBufferRange",
    "glGetBufferPointerv", "glGetNamedBufferPointerv",
    "glGetVertexAttribPointerv", "glGetPointerv",

    # And under the names the extensions that introduced them used. The
    # driver's entry point is the same one; what changes is which
    # extension may be claimed because of it — GL_ARB_vertex_shader
    # needs glGetVertexAttribPointervARB, and GL_ARB_vertex_buffer_object
    # needs the mapping family's ARB spellings.
    "glMapBufferARB", "glUnmapBufferARB", "glGetBufferPointervARB",
    "glGetVertexAttribPointervARB", "glGetPointervEXT",
]

# Commands that answer with nothing and must be waited for anyway.
#
# The rule everywhere else is that a command with no return value and
# no out parameter does not wait — ordering comes from the ring, so a
# caller has nothing to learn by blocking. glFinish is the exception
# that the signature cannot show: what it returns is nothing and what
# it means is "do not come back until the GPU has finished". Sent
# one-way it becomes a no-op, and anything timed around it measures how
# fast this driver can fill a queue.
#
# glFlush is deliberately not here. It asks that work be started, not
# that it be finished, and the ring has already started it.
synchronous = ["glFinish"]

# What a pointer query would answer with is a pointer in the guest,
# which the host has never seen: the guest kept it when the application
# passed it and answers from there. These never cross.
excluded = [
    # A pointer query answers with a pointer in the guest, which the
    # host has never seen: the guest kept it when the application
    # passed it and answers from there.
    "glGetBufferPointerv",
    "glGetVertexAttribPointerv",
    "glGetPointerv",

    # Mapping hands the application a pointer into the driver's memory,
    # and there is no such pointer to hand across a VM boundary. What
    # it becomes is a shadow copy in the guest, filled at map and
    # written back at unmap — the shape the OpenCL side already has for
    # clEnqueueMapBuffer. That belongs in the guest driver, so these
    # wait for it rather than being generated into something that
    # cannot work.
    "glMapBuffer",
    "glMapBufferRange",
    "glUnmapBuffer",
    "glFlushMappedBufferRange",
    "glMapNamedBuffer",
    "glMapNamedBufferRange",
    "glUnmapNamedBuffer",
    "glFlushMappedNamedBufferRange",
    "glGetNamedBufferPointerv",

    # The robustness forms of the evaluator and pixel-map queries. Both
    # are fixed-function: an evaluator is a Bezier patch from 1.0 and a
    # pixel map is the colour table that went with it. They are in 4.5
    # only because the robustness extension gave every query a sized
    # form, and there is no core-profile context that will answer one.
    "glGetnMapdv", "glGetnMapfv", "glGetnMapiv",
    "glGetnPixelMapfv", "glGetnPixelMapuiv", "glGetnPixelMapusv",
    "glGetnPolygonStipple", "glGetnColorTable", "glGetnConvolutionFilter",
    "glGetnSeparableFilter", "glGetnHistogram", "glGetnMinmax",

    # The direct-state-access spellings of the two things that cannot
    # cross. Mapping hands back an address, and a pointer query answers
    # with one; the guest already answers both for the core spellings
    # and these forward to that. They are named here so they are not
    # generated, and in [driver_implemented] so the extension may still
    # be claimed.
    "glMapNamedBufferEXT", "glMapNamedBufferRangeEXT", "glUnmapNamedBufferEXT",
    "glFlushMappedNamedBufferRangeEXT", "glGetNamedBufferPointervEXT", "glGetPointerIndexedvEXT",
    "glGetPointeri_vEXT", "glGetVertexArrayPointervEXT", "glGetVertexArrayPointeri_vEXT",
]

# Other spellings the registry does not write down.
#
# gl.xml gives most extension commands an <alias> to the core one they
# became, and the driver answers to both. Two of the framebuffer
# family have none: glBindFramebufferEXT and glBindRenderbufferEXT.
# The registry is being careful — EXT_framebuffer_object lets an
# application bind a name it never generated and the core profile does
# not — and every desktop driver has implemented them as the same
# entry point regardless.
#
# It matters because of what depends on it. An application that asks
# for GL_EXT_framebuffer_object and is told no turns its graphics
# processor off, which is exactly what Photoshop's sniffer does; and
# an extension is only claimed here when every command it needs can be
# answered. These two can be.
[aliases]
glBindFramebufferEXT = "glBindFramebuffer"
glBindRenderbufferEXT = "glBindRenderbuffer"

# Tiers named by feature. None yet: the boot tier above is named one
# command at a time, because its point is a path that works end to end
# before the surface is widened. "core" comes next and is written here
# as the features GL_VERSION_1_0 through GL_VERSION_3_3, whose removals
# leave the core profile.
[tiers]
core = [
    "GL_VERSION_1_0", "GL_VERSION_1_1", "GL_VERSION_1_2", "GL_VERSION_1_3",
    "GL_VERSION_1_4", "GL_VERSION_1_5", "GL_VERSION_2_0", "GL_VERSION_2_1",
    "GL_VERSION_3_0", "GL_VERSION_3_1", "GL_VERSION_3_2", "GL_VERSION_3_3",
    "GL_VERSION_4_0", "GL_VERSION_4_1", "GL_VERSION_4_2", "GL_VERSION_4_3",
    "GL_VERSION_4_4", "GL_VERSION_4_5", "GL_VERSION_4_6",
]
# The compatibility profile: everything 1.0 and 1.1 asked for and 3.2
# took away again. It is written as the two features on their own
# because a removal only applies where the tier names the feature that
# wrote it — core lists 3.2 and loses immediate mode, this one does not
# list it and keeps it.
#
# It stops at 3.1 because 3.2 is the only feature in the registry that
# declares removals: listing it would take the fixed-function half of
# every earlier version away again, which is exactly what the core
# tier above is. Everything from 1.2 to 3.0 has a compatibility half
# too — fog coordinates, secondary colours, window positions — and
# Photoshop resolves all three.
#
# Nothing here is new work for the wire: these are ordinary commands
# with ordinary lengths. What they need is a context that will accept
# them, which is what profile_mask 2 asks the server for.
compat = [
    "GL_VERSION_1_0", "GL_VERSION_1_1", "GL_VERSION_1_2", "GL_VERSION_1_3",
    "GL_VERSION_1_4", "GL_VERSION_1_5", "GL_VERSION_2_0", "GL_VERSION_2_1",
    "GL_VERSION_3_0", "GL_VERSION_3_1",
]

# What the registry writes as COMPSIZE, said plainly.
#
# COMPSIZE is the registry saying "ask the API". Where the answer is a
# fixed rule it is written here as C; where only the driver knows it,
# the C names a helper in av::glproto that asks — the transport is in
# scope at the point the length is needed, so a helper may cross the
# wire to work it out. See src/apis/opengl/proto/include/gl_helpers.h.
[params]

# A name is a name: null-terminated, and the registry's COMPSIZE(name)
# says nothing more than that.
[params."glBindFragDataLocation.name"]
role = "string_in"

[params."glGetFragDataLocation.name"]
role = "string_in"

[params."glGetUniformBlockIndex.uniformBlockName"]
role = "string_in"

[params."glGetUniformIndices.uniformNames"]
role = "string_array_in"
len = "uniformCount"

[params."glGetUniformIndices.uniformIndices"]
len = "uniformCount"

# Which buffer of the framebuffer is being cleared decides how many
# values the colour is: GL_COLOR takes four, depth and stencil one.
# glGetSynciv, where `count` is the caller's room and `length` is what
# was written.
#
# Same shape as the internal-format queries below, and the same bite.
# Every pname a sync object answers — GL_OBJECT_TYPE, GL_SYNC_STATUS,
# GL_SYNC_CONDITION, GL_SYNC_FLAGS — is a single value, and the call
# reports through `length` how many it wrote. ogl-samples passes 4 as
# the count for one GLint on the stack:
#
#   glGetSynciv(Fence, GL_SYNC_STATUS, 4, &Length, &Status);
#
# Taking that at its word writes sixteen bytes into four, and what was
# next to it in gl-320-fbo-readpixels-staging was the GLsync handle
# itself — so the corruption did not show as a wrong status, it showed
# as the glDeleteSync on the following line failing with
# GL_INVALID_VALUE on a fence that had been valid a moment earlier.
[params."glGetSynciv.values"]
len = "1"

# glGetProgramResourceiv, where `count` is again the caller's room.
#
# The answer is one value per property asked for, which is propCount of
# them, and the call reports through `length` how many it wrote.
# ogl-samples asks for fourteen properties into a fourteen-int struct
# and passes sizeof(that struct) — fifty-six — as the count, meaning
# "room for fifty-six values", which against a real driver is a
# harmless overstatement because it writes fourteen.
#
# Taking it at its word writes two hundred and twenty-four bytes into
# fifty-six. What was next to it on the stack in gl-430-buffer-uniform
# was the shader compiler the program was still using, so the crash
# came later and somewhere else: a page fault inside compiler::clear(),
# a hundred lines from the call that caused it.
[params."glGetProgramResourceiv.params"]
len = "static_cast<size_t>(propCount) < static_cast<size_t>(count) ? static_cast<size_t>(propCount) : static_cast<size_t>(count)"

# The same call under its Apple name, for the same reason.
[params."glGetSyncivAPPLE.values"]
len = "1"

# The internal-format queries, where `count` is the caller's room and
# not the answer's size.
#
# gl.xml gives these params len="count", and count is a maximum the
# caller declares. Every pname but GL_SAMPLES defines exactly one
# value, so a driver writes one and leaves the rest of the caller's
# buffer alone — and a caller may quite legally declare more room than
# it has values for. ogl-samples does exactly that: it passes
# sizeof(GLint64) as the count, meaning "eight", for a single GLint64
# on the stack. Natively that is harmless. Taking len at its word here
# is not: the host writes one value, this side returns eight elements'
# worth, and the memcpy that lands them puts sixty-four bytes into
# eight bytes of the caller's stack.
#
# GL_SAMPLES is the one pname that really does return `count` of them —
# that is what GL_NUM_SAMPLE_COUNTS is asked for first.
[params."glGetInternalformativ.params"]
len = "(pname == 0x80A9 ? count : 1)"

[params."glGetInternalformati64v.params"]
len = "(pname == 0x80A9 ? count : 1)"

# And the NV variant, which asks the same question per sample count.
[params."glGetInternalformatSampleivNV.params"]
len = "(pname == 0x80A9 ? count : 1)"

[params."glClearBufferfv.value"]
len = "(buffer == 0x1800 ? 4 : 1)"

[params."glClearBufferiv.value"]
len = "(buffer == 0x1800 ? 4 : 1)"

[params."glClearBufferuiv.value"]
len = "(buffer == 0x1800 ? 4 : 1)"

