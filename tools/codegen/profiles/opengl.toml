    "glNamedProgramLocalParameterI4uivEXT", "glNamedProgramLocalParametersI4uivEXT", "glGetNamedProgramLocalParameterIivEXT",
    "glGetNamedProgramLocalParameterIuivEXT", "glEnableClientStateiEXT", "glDisableClientStateiEXT",
    "glGetFloati_vEXT", "glGetDoublei_vEXT", "glNamedProgramStringEXT",
