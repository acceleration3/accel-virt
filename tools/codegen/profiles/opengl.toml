# The vertex attribute queries answer with one value for every pname
# except GL_CURRENT_VERTEX_ATTRIB, which is four.
#
# The registry writes four for the float and double forms and one for
# the integer forms, which is the maximum in one case and the minimum
# in the other, and neither is the count. Writing back four values for
# a query the application asked one value of overruns its buffer — on
# a guest that smashed the caller's stack and turned a vertex array
# name into zero, several calls later. So the count is written here
# exactly, for every form.
[params."glGetVertexAttribiv.params"]
