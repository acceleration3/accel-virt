# What the OpenGL registry does not say.
#
# Tiers are the plan. Three thousand commands exist and no application
# calls more than a few hundred, so they are taken in order and each
# tier is finished — annotated, generated, and tested — before the next
# one starts. A tier names features; everything they require is in,
# minus everything any of them removed, which is how the core profile
# is written in the registry.
#
#   boot   what it takes to draw a triangle and read it back
#   core   GL 3.3 core, which is what zink targets and most modern
#          applications use
#   later  4.0 through 4.6, then the compatibility profile
#
# Only the tiers listed under [tiers] are generated. Moving a tier from
# a comment into the table is the whole act of widening the driver.

extra = [
    # Strings and the error queue
    "glGetString", "glGetStringi", "glGetError",
    "glGetIntegerv", "glGetFloatv", "glGetBooleanv",

    # The framebuffer as it is found
    "glViewport", "glScissor", "glClearColor", "glClearDepth", "glClear",
    "glEnable", "glDisable", "glIsEnabled", "glBlendFunc", "glDepthFunc",
    "glDepthMask", "glColorMask", "glCullFace", "glFrontFace",
    "glPixelStorei", "glFinish", "glFlush", "glReadPixels", "glReadBuffer",
    "glDrawBuffer", "glDrawBuffers",

    # Buffers
    "glGenBuffers", "glDeleteBuffers", "glBindBuffer", "glBufferData",
    "glBufferSubData", "glGetBufferParameteriv", "glIsBuffer",

    # Vertex arrays
    "glGenVertexArrays", "glDeleteVertexArrays", "glBindVertexArray",
    "glVertexAttribPointer", "glEnableVertexAttribArray",
    "glDisableVertexAttribArray", "glVertexAttrib4f",

    # Shaders and programs
    "glCreateShader", "glDeleteShader", "glShaderSource", "glCompileShader",
    "glGetShaderiv", "glGetShaderInfoLog", "glCreateProgram",
    "glDeleteProgram", "glAttachShader", "glDetachShader", "glLinkProgram",
    "glGetProgramiv", "glGetProgramInfoLog", "glUseProgram",
    "glBindAttribLocation", "glGetAttribLocation", "glGetUniformLocation",
    "glUniform1i", "glUniform1f", "glUniform2f", "glUniform3f",
    "glUniform4f", "glUniform1fv", "glUniform4fv", "glUniformMatrix4fv",

    # Textures
    "glGenTextures", "glDeleteTextures", "glBindTexture", "glActiveTexture",
    "glTexImage2D", "glTexSubImage2D", "glTexParameteri", "glTexParameterf",
    "glGetTexImage", "glGenerateMipmap", "glIsTexture",

    # Framebuffer objects
    "glGenFramebuffers", "glDeleteFramebuffers", "glBindFramebuffer",
    "glFramebufferTexture2D", "glCheckFramebufferStatus",
    "glGenRenderbuffers", "glDeleteRenderbuffers", "glBindRenderbuffer",
    "glRenderbufferStorage", "glFramebufferRenderbuffer", "glBlitFramebuffer",

    # Drawing
    "glDrawArrays", "glDrawElements", "glDrawArraysInstanced",
    "glDrawElementsInstanced",

    # GL_ARB_shader_objects, where it is not the core object model
    # under another name. The extension had one handle type for shaders
    # and programs both, so these six have no core spelling to alias:
    # deleting an object without knowing which kind it is, asking which
    # program is current, an object's parameters, its log, and what is
    # attached to it.
    #
    # They are here because an application of that era resolves the
    # whole table and refuses the extension if any of it is missing,
    # and Photoshop's is one — its shading language support is a table
    # of ARB entry points, and one null in it turns the feature off.
    "glDeleteObjectARB", "glGetHandleARB", "glGetObjectParameterfvARB",
    "glGetObjectParameterivARB", "glGetInfoLogARB",
    "glGetAttachedObjectsARB",

    # Extensions the host has had all along and this driver was not
    # asking for.
    #
    # None of these is new machinery: every one is an ordinary command
    # with an ordinary length. What kept them out is the rule in
    # lower.py that an extension may be claimed only when every command
    # it needs is generated, so a command left out here is an extension
    # the guest is told it does not have however much the card can do.
    # Six samples in the pack stop at exactly that sentence, on a
    # 3070 Ti that offers all of it.
    #
    # Sparse textures: one command, and three extension names. The two
    # "2" spellings add no entry points of their own and reach this one
    # through [extension_requires].
    "glTexPageCommitmentARB",

    # Sparse buffers.
    "glBufferPageCommitmentARB", "glNamedBufferPageCommitmentEXT",
    "glNamedBufferPageCommitmentARB",

    # Committing a page of a texture by name rather than by binding.
    # The registry declares it under GL_EXT_direct_state_access and
    # nowhere else, and it was never promoted to core the way the rest
    # of that extension's texture commands were — so an application
    # doing 4.5 direct state access on a sparse texture, which
    # gl-500-texture-sparse-ext is, reaches for this one EXT name in
    # the middle of otherwise core code. Generating the entry point
    # does not claim the extension: that still needs all 255 of it.
    "glTexturePageCommitmentEXT",

    # How many threads the host may compile shaders on: a hint, and the
    # whole of GL_ARB_parallel_shader_compile.
    "glMaxShaderCompilerThreadsARB", "glMaxShaderCompilerThreadsKHR",

    # An exclusive scissor rectangle, and where inside a pixel the
    # samples are taken.
    "glScissorExclusiveNV", "glScissorExclusiveArrayvNV",
    "glFramebufferSampleLocationsfvNV",
    "glNamedFramebufferSampleLocationsfvNV", "glResolveDepthValuesNV",

    # Bindless textures, both spellings.
    #
    # A handle is a 64-bit number the host driver makes up and nothing
    # here needs to understand: it is asked for by texture name, which
    # is a name this side already translates, and every later use of it
    # is the number going back the way it came. So these cross as
    # ordinary commands and the handle is opaque on the wire — no table
    # and no translation, unlike a texture or a buffer.
    "glGetTextureHandleARB", "glGetTextureSamplerHandleARB",
    "glMakeTextureHandleResidentARB", "glMakeTextureHandleNonResidentARB",
    "glGetImageHandleARB",
    "glMakeImageHandleResidentARB", "glMakeImageHandleNonResidentARB",
    "glUniformHandleui64ARB", "glUniformHandleui64vARB",
    "glProgramUniformHandleui64ARB", "glProgramUniformHandleui64vARB",
    "glIsTextureHandleResidentARB", "glIsImageHandleResidentARB",
    "glVertexAttribL1ui64ARB", "glVertexAttribL1ui64vARB",
    "glGetVertexAttribLui64vARB",

    "glGetTextureHandleNV", "glGetTextureSamplerHandleNV",
    "glMakeTextureHandleResidentNV", "glMakeTextureHandleNonResidentNV",
    "glGetImageHandleNV",
    "glMakeImageHandleResidentNV", "glMakeImageHandleNonResidentNV",
    "glUniformHandleui64NV", "glUniformHandleui64vNV",
    "glProgramUniformHandleui64NV", "glProgramUniformHandleui64vNV",
    "glIsTextureHandleResidentNV", "glIsImageHandleResidentNV",

    # A buffer's memory addressed by its GPU address rather than by a
    # binding. Same shape as the handles above: the address is the
    # host's and travels as a number.
    "glMakeBufferResidentNV", "glMakeBufferNonResidentNV",
    "glIsBufferResidentNV",
    "glMakeNamedBufferResidentNV", "glMakeNamedBufferNonResidentNV",
    "glIsNamedBufferResidentNV",
    "glGetBufferParameterui64vNV", "glGetNamedBufferParameterui64vNV",
    "glGetIntegerui64vNV",
    "glUniformui64NV", "glUniformui64vNV", "glGetUniformui64vNV",
    "glProgramUniformui64NV", "glProgramUniformui64vNV",

    # And the vertex arrays that go with those addresses: the format of
    # an attribute said once, and the memory it comes from given as a
    # range rather than as a bound buffer. This is what
    # gl-500-primitive-bindless-nv draws with.
    "glBufferAddressRangeNV",
    "glVertexFormatNV", "glNormalFormatNV", "glColorFormatNV",
    "glIndexFormatNV", "glTexCoordFormatNV", "glEdgeFlagFormatNV",
    "glSecondaryColorFormatNV", "glFogCoordFormatNV",
    "glVertexAttribFormatNV", "glVertexAttribIFormatNV",
    "glGetIntegerui64i_vNV",

    # 64-bit integer uniforms. GL_NV_gpu_shader5 is mostly a shading
    # language extension — what it adds to the API is one setter per
    # width per signedness, the same shape as every other glUniform,
    # and a query to read one back.
    "glUniform1i64NV", "glUniform2i64NV", "glUniform3i64NV",
    "glUniform4i64NV",
    "glUniform1i64vNV", "glUniform2i64vNV", "glUniform3i64vNV",
    "glUniform4i64vNV",
    "glUniform1ui64NV", "glUniform2ui64NV", "glUniform3ui64NV",
    "glUniform4ui64NV",
    "glUniform1ui64vNV", "glUniform2ui64vNV", "glUniform3ui64vNV",
    "glUniform4ui64vNV",
    "glGetUniformi64vNV",
    "glProgramUniform1i64NV", "glProgramUniform2i64NV",
    "glProgramUniform3i64NV", "glProgramUniform4i64NV",
    "glProgramUniform1i64vNV", "glProgramUniform2i64vNV",
    "glProgramUniform3i64vNV", "glProgramUniform4i64vNV",
    "glProgramUniform1ui64NV", "glProgramUniform2ui64NV",
    "glProgramUniform3ui64NV", "glProgramUniform4ui64NV",
    "glProgramUniform1ui64vNV", "glProgramUniform2ui64vNV",
    "glProgramUniform3ui64vNV", "glProgramUniform4ui64vNV",

    # GL_EXT_direct_state_access.
    #
    # 255 commands, which is most of the API again with the binding
    # taken out of it: every one names the object it acts on instead of
    # acting on whatever is bound. It is claimed here because
    # applications of a certain age ask for it and fall back badly when
    # told no, and because nine of its commands are the only spelling
    # of what they do — see the [excluded] block for those.
    "glMatrixLoadfEXT", "glMatrixLoaddEXT", "glMatrixMultfEXT",
    "glMatrixMultdEXT", "glMatrixLoadIdentityEXT", "glMatrixRotatefEXT",
    "glMatrixRotatedEXT", "glMatrixScalefEXT", "glMatrixScaledEXT",
    "glMatrixTranslatefEXT", "glMatrixTranslatedEXT", "glMatrixFrustumEXT",
    "glMatrixOrthoEXT", "glMatrixPopEXT", "glMatrixPushEXT",
    "glClientAttribDefaultEXT", "glPushClientAttribDefaultEXT", "glTextureParameterfEXT",
    "glTextureParameterfvEXT", "glTextureParameteriEXT", "glTextureParameterivEXT",
    "glTextureImage1DEXT", "glTextureImage2DEXT", "glTextureSubImage1DEXT",
    "glTextureSubImage2DEXT", "glCopyTextureImage1DEXT", "glCopyTextureImage2DEXT",
    "glCopyTextureSubImage1DEXT", "glCopyTextureSubImage2DEXT", "glGetTextureImageEXT",
    "glGetTextureParameterfvEXT", "glGetTextureParameterivEXT", "glGetTextureLevelParameterfvEXT",
    "glGetTextureLevelParameterivEXT", "glTextureImage3DEXT", "glTextureSubImage3DEXT",
    "glCopyTextureSubImage3DEXT", "glBindMultiTextureEXT", "glMultiTexCoordPointerEXT",
    "glMultiTexEnvfEXT", "glMultiTexEnvfvEXT", "glMultiTexEnviEXT",
    "glMultiTexEnvivEXT", "glMultiTexGendEXT", "glMultiTexGendvEXT",
    "glMultiTexGenfEXT", "glMultiTexGenfvEXT", "glMultiTexGeniEXT",
    "glMultiTexGenivEXT", "glGetMultiTexEnvfvEXT", "glGetMultiTexEnvivEXT",
    "glGetMultiTexGendvEXT", "glGetMultiTexGenfvEXT", "glGetMultiTexGenivEXT",
    "glMultiTexParameteriEXT", "glMultiTexParameterivEXT", "glMultiTexParameterfEXT",
    "glMultiTexParameterfvEXT", "glMultiTexImage1DEXT", "glMultiTexImage2DEXT",
    "glMultiTexSubImage1DEXT", "glMultiTexSubImage2DEXT", "glCopyMultiTexImage1DEXT",
    "glCopyMultiTexImage2DEXT", "glCopyMultiTexSubImage1DEXT", "glCopyMultiTexSubImage2DEXT",
    "glGetMultiTexImageEXT", "glGetMultiTexParameterfvEXT", "glGetMultiTexParameterivEXT",
    "glGetMultiTexLevelParameterfvEXT", "glGetMultiTexLevelParameterivEXT", "glMultiTexImage3DEXT",
    "glMultiTexSubImage3DEXT", "glCopyMultiTexSubImage3DEXT", "glEnableClientStateIndexedEXT",
    "glDisableClientStateIndexedEXT", "glGetFloatIndexedvEXT", "glGetDoubleIndexedvEXT",
    "glEnableIndexedEXT", "glDisableIndexedEXT", "glIsEnabledIndexedEXT",
