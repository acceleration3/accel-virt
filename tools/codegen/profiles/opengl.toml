# overrun on the side that allocated it.
GL_COMPUTE_WORK_GROUP_SIZE = 3

# The tessellation levels a patch is given when there is no control
# shader to set them: four along the edges and two inside. Read as one
# value each, three of the outer levels and one of the inner never
# crossed, and the host read them out of a buffer sized for one — so
# what a patch was tessellated by was whatever followed that float on
# the server's heap. gl-450-primitive-tessellation-eval drew a fan of
# lines from the corners where the host drew a grid.
GL_PATCH_DEFAULT_OUTER_LEVEL = 4
GL_PATCH_DEFAULT_INNER_LEVEL = 2

# The compatibility profile's state, which is where the many-valued
# queries mostly live. A matrix is sixteen floats; a colour, a plane and
# a raster position are four; a normal is three. Every one of these was
# read as one value before the tier carried them, and the host writes
# the real number regardless — see kQuerySlack in the generated server
# for why that stopped being a corrupted heap.
GL_MODELVIEW_MATRIX = 16
GL_PROJECTION_MATRIX = 16
GL_TEXTURE_MATRIX = 16
GL_COLOR_MATRIX = 16
GL_TRANSPOSE_MODELVIEW_MATRIX = 16
GL_TRANSPOSE_PROJECTION_MATRIX = 16
GL_TRANSPOSE_TEXTURE_MATRIX = 16
GL_TRANSPOSE_COLOR_MATRIX = 16

GL_CURRENT_COLOR = 4
GL_CURRENT_SECONDARY_COLOR = 4
GL_CURRENT_TEXTURE_COORDS = 4
GL_CURRENT_RASTER_COLOR = 4
GL_CURRENT_RASTER_SECONDARY_COLOR = 4
GL_CURRENT_RASTER_TEXTURE_COORDS = 4
GL_CURRENT_RASTER_POSITION = 4
GL_CURRENT_NORMAL = 3

GL_FOG_COLOR = 4
GL_LIGHT_MODEL_AMBIENT = 4
GL_ACCUM_CLEAR_VALUE = 4
GL_TEXTURE_ENV_COLOR = 4
GL_POINT_DISTANCE_ATTENUATION = 3
GL_MAP1_GRID_DOMAIN = 2
GL_MAP2_GRID_DOMAIN = 4
GL_MAP2_GRID_SEGMENTS = 2
GL_LINE_WIDTH_RANGE = 2
GL_POINT_SIZE_IMPLEMENTATION_DEPENDENT = 2

GL_TEXTURE_SWIZZLE_RGBA = 4
GL_TEXTURE_BORDER_COLOR = 4

# Extensions written on top of another extension.
#
# The registry does not record that GL_ARB_sparse_texture2 is
# meaningless without GL_ARB_sparse_texture: the second one carries the
# entry points and the first is a set of GLSL functions and a promise
# about them. An extension with no commands of its own passes the
# "every command is carried" test by having no commands, so without
# this it would be offered by a driver that cannot do any of it.
#
# gl-500-texture-sparse-ext is what that costs: it asked for
# GL_EXT_sparse_texture2, was told yes, resolved
# glTexPageCommitmentARB to null and called it.
[extension_requires]
GL_ARB_sparse_texture2 = "GL_ARB_sparse_texture"
GL_ARB_sparse_texture_clamp = "GL_ARB_sparse_texture2"
GL_EXT_sparse_texture2 = "GL_ARB_sparse_texture"
