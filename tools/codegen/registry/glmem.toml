[meta]
api = 3
prefix = "glmem"
first_id = 0x8000
last_id = 0x8fff

[[command]]
name = "QueryBufferSlicesGL"
id = 0x8000
doc = """Whether an OpenGL buffer can be placed in a slice of a block of slice memory (PlaceBufferSlice): 1 when the
host's context imports memory objects, places a buffer in one by name at an offset, and marks each of its batches
with a fence the GPU signals, 0 when it cannot - the guest then keeps its copies of what it maps, as before
(docs/mapped-buffers-plan.md)."""
params = []
reply = ["u32 supported"]

[[command]]
name = "PlaceBufferSlice"
id = 0x8001
doc = """The buffer `buffer` of the context, which has no storage yet, from now on is `bytes` at `offset` of the memory object
`memory` - a block of the context's slice memory, named by the handle IMPORT_BLOB answered (docs/host-memory.md) - which the
guest writes and the host GPU reads or writes in place. A `memory` the context did not import, or an `offset` and `bytes`
that are not inside it, places nothing and records GL_INVALID_VALUE. The host keeps an imported block until its GPU work has
run and every buffer placed in it was forgotten."""
params = ["u32 buffer", "u64 memory", "u64 offset", "u64 bytes"]

[[command]]
name = "ForgetBufferSlice"
id = 0x8002
doc = """The buffer was placed in a slice (PlaceBufferSlice) and is deleted by the commands before this one: the host stops
counting it among the buffers that keep the block it was placed in."""
params = ["u32 buffer"]
