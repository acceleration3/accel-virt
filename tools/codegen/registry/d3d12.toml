[[command]]
name = "CreateCommandList12"
id = 0x1403
doc = """A command list, open for recording with `allocator` and `pipeline` (0 for none)."""
params = ["u32 list", "u32 allocator", "u32 type", "u32 pipeline"]

[[command]]
name = "ResetCommandList12"
id = 0x1404
params = ["u32 list", "u32 allocator", "u32 pipeline"]

[[command]]
name = "CloseCommandList12"
id = 0x1405
