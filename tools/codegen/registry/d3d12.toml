[meta]
api = 4
prefix = "d3d12"
first_id = 0x1000
last_id = 0x1fff

[structs.Float4]
fields = ["f32 v[4]"]

[structs.Uint4]
fields = ["u32 v[4]"]

[structs.Rect]
fields = ["i32 left", "i32 top", "i32 right", "i32 bottom"]

[structs.Box]
fields = ["u32 left", "u32 top", "u32 front", "u32 right", "u32 bottom", "u32 back"]

[structs.Viewport]
fields = ["f32 x", "f32 y", "f32 width", "f32 height", "f32 min_depth", "f32 max_depth"]

[structs.SamplePosition]
fields = ["i32 x", "i32 y"]

[structs.ImmediateWrite]
fields = ["u64 address", "u32 value", "u32 mode"]

[structs.StreamOutputView]
fields = ["u64 address", "u64 size", "u64 filled_address"]

[structs.DescriptorRef]
fields = ["u32 heap", "u32 index"]

[structs.HeapProperties]
fields = ["u32 type", "u32 cpu_page", "u32 pool", "u32 reserved"]

[structs.ResourceDesc]
fields = ["u64 alignment", "u64 width", "u32 dimension", "u32 height", "u32 depth_or_array", "u32 mip_levels",
          "u32 format", "u32 sample_count", "u32 sample_quality", "u32 layout", "u32 flags", "u32 reserved"]

[structs.ClearValue]
fields = ["u32 present", "u32 format", "f32 color[4]", "f32 depth", "u32 stencil"]

[structs.ViewDesc]
fields = ["u64 first_element", "u64 counter_offset", "u32 resource", "u32 counter_resource", "u32 format",
          "u32 dimension", "u32 mapping", "u32 flags", "u32 args[6]", "f32 min_lod", "u32 reserved"]

[structs.SamplerDesc]
fields = ["u32 filter", "u32 address_u", "u32 address_v", "u32 address_w", "f32 mip_lod_bias",
          "u32 max_anisotropy", "u32 comparison", "f32 border_color[4]", "f32 min_lod", "f32 max_lod"]

[structs.RootParameter]
fields = ["u32 type", "u32 visibility", "u32 shader_register", "u32 register_space", "u32 values",
          "u32 first_range", "u32 range_count", "u32 flags"]

[structs.DescriptorRange]
fields = ["u32 type", "u32 count", "u32 base_register", "u32 register_space", "u32 offset", "u32 flags"]

[structs.StaticSampler]
fields = ["u32 filter", "u32 address_u", "u32 address_v", "u32 address_w", "f32 mip_lod_bias",
          "u32 max_anisotropy", "u32 comparison", "u32 border", "f32 min_lod", "f32 max_lod",
          "u32 shader_register", "u32 register_space", "u32 visibility", "u32 reserved"]

[structs.SignatureEntry]
fields = ["u32 set", "u32 system_value", "u32 register_index", "u32 mask", "u32 component_type",
          "u32 min_precision", "u32 stream", "u32 reserved"]

[structs.StreamOutDeclaration]
fields = ["u32 stream", "u32 output_slot", "u32 register_index", "u32 mask"]

[structs.InputElement]
fields = ["u32 input_slot", "u32 aligned_byte_offset", "u32 format", "u32 classification", "u32 step_rate",
          "u32 input_register"]

[structs.RenderTargetBlend]
fields = ["u32 blend_enable", "u32 logic_op_enable", "u32 src_blend", "u32 dest_blend", "u32 blend_op",
          "u32 src_blend_alpha", "u32 dest_blend_alpha", "u32 blend_op_alpha", "u32 logic_op",
          "u32 write_mask"]

[structs.RasterizerDesc]
fields = ["u32 fill_mode", "u32 cull_mode", "u32 front_counter_clockwise", "i32 depth_bias",
          "f32 depth_bias_clamp", "f32 slope_scaled_depth_bias", "u32 depth_clip", "u32 line_mode",
          "u32 forced_sample_count", "u32 conservative"]

[structs.StencilOp]
fields = ["u32 fail", "u32 depth_fail", "u32 pass", "u32 func"]

[structs.DepthStencilDesc]
fields = ["u32 depth_enable", "u32 depth_write_mask", "u32 depth_func", "u32 stencil_enable",
          "u32 stencil_read_mask", "u32 stencil_write_mask", "StencilOp front", "StencilOp back",
          "u32 depth_bounds_enable", "u32 back_read_mask", "u32 back_write_mask", "u32 reserved"]

[structs.ViewInstanceLocation]
fields = ["u32 viewport_index", "u32 render_target_index"]

[structs.GraphicsState]
fields = ["u32 alpha_to_coverage", "u32 independent_blend", "RenderTargetBlend targets[8]",
          "u32 sample_mask", "RasterizerDesc rasterizer", "DepthStencilDesc depth_stencil",
          "u32 strip_cut", "u32 topology_type", "u32 render_targets", "u32 rtv_formats[8]",
          "u32 dsv_format", "u32 sample_count", "u32 sample_quality", "u32 flags",
          "u32 view_instance_count", "u32 view_instancing_flags", "ViewInstanceLocation view_instances[4]"]

[structs.LayoutBarrier]
fields = ["u32 type", "u32 flags", "u32 sync_before", "u32 sync_after", "u32 access_before", "u32 access_after",
          "u32 layout_before", "u32 layout_after", "u32 resource", "u32 first_mip", "u32 mip_count", "u32 first_slice",
          "u32 slice_count", "u32 first_plane", "u32 plane_count", "u32 reserved"]

[structs.Barrier]
fields = ["u32 type", "u32 flags", "u32 resource", "u32 subresource", "u32 before", "u32 after",
          "u32 resource_after", "u32 reserved"]

[structs.VertexBufferView]
fields = ["u64 address", "u32 size", "u32 stride"]

[structs.CopyLocation]
fields = ["u64 offset", "u32 resource", "u32 type", "u32 subresource", "u32 format", "u32 width", "u32 height",
          "u32 depth", "u32 row_pitch"]

[structs.IndirectArgument]
fields = ["u32 type", "u32 a", "u32 b", "u32 c"]

[structs.TileCoordinate]
fields = ["u32 x", "u32 y", "u32 z", "u32 subresource"]

[structs.TileSize]
fields = ["u32 tiles", "u32 use_box", "u32 width", "u32 height", "u32 depth"]

[structs.TileRegion]
fields = ["TileCoordinate start", "TileSize size"]

[structs.TileRange]
fields = ["u32 flags", "u32 heap_offset", "u32 tiles"]

[structs.Caps12]
fields = ["u32 layout", "u32 feature_level", "u32 shader_model", "u32 resource_binding_tier", "u32 tiled_resources_tier",
          "u32 resource_heap_tier", "u32 conservative_rasterization_tier", "u32 typed_uav_load_additional_formats",
          "u32 rovs", "u32 max_gpu_va_bits_per_resource", "u32 max_gpu_va_bits_per_process",
          "u32 descriptor_sizes[4]",
          "u32 double_ops", "u32 int64_ops", "u32 wave_ops", "u32 wave_lane_min", "u32 wave_lane_max",
          "u32 total_lanes", "u32 output_merger_logic_op",
          "u32 min_precision", "u32 ps_stencil_ref", "u32 native_16bit_ops", "u32 atomic_int64_typed",
          "u32 atomic_int64_group_shared", "u32 barycentrics", "u32 vp_rt_array_without_gs",
          "u32 advanced_texture_ops", "u32 writeable_msaa_textures", "u32 sample_cmp_gradient_bias",
          "u32 extended_command_info",
          "u32 depth_bounds", "u32 view_instancing_tier", "u32 mesh_shader_tier",
          "u32 vrs_tier", "u32 vrs_additional_rates", "u32 vrs_tile_size", "u32 vrs_per_primitive_viewport",
          "u32 vrs_sum_combiner", "u32 enhanced_barriers", "u32 relaxed_format_casting", "u32 write_immediate_queues",
          "u32 copy_queue_timestamps", "u32 atomic_int64_heap",
          "u32 programmable_sample_positions_tier", "u32 render_pass_tier"]

[[command]]
name = "OpenDevice12"
id = 0x1000
doc = """The session's Direct3D 12 device: the host's shared device for this GPU. One per session; a second
open answers the same device. hresult is not S_OK when this GPU has none."""
params = ["u32 flags"]
reply = ["u32 hresult"]

[[command]]
name = "Destroy12"
id = 0x1002
doc = """Any object made by these commands, by id. The host keeps what the GPU still uses alive until it is done, and
what a recorded command list names until that list is reset or destroyed and its last execution is done."""
params = ["u32 object"]

[[command]]
name = "Finish12"
id = 0x1003
doc = """Waits until every queue of the session has finished what was executed on it. hresult is the device's
removed reason: S_OK while it is not removed."""
params = []
reply = ["u32 hresult"]

[[command]]
name = "QueryCaps12"
id = 0x1004
doc = """What this GPU's Direct3D 12 device can do, asked once per adapter and without opening it: Caps12,
and d3d.toml's FormatCaps for every DXGI_FORMAT from 0 up, as many as fit. hresult is not S_OK when this GPU
has no device, and then nothing else is answered."""
params = []
reply = ["u32 hresult", "Caps12 caps", "out_bytes formats"]

[[command]]
name = "QueryHeapSlices12"
id = 0x1005
doc = """Whether a CPU-visible heap can be a window into a block of shared host memory (CreateHeap12's `offset`): 1
when the host has a device, which follows every queue's progress so it can tell when a block's last heap and
resource are done with, 0 when it has none. The guest then gives each heap memory of its own."""
params = []
reply = ["u32 supported"]

[[command]]
name = "QueryHeapPlacement12"
id = 0x1006
doc = """Whether the host makes a CPU-visible heap's memory itself: 1 when its GPU driver refuses to import the host
memory the guest opened, so CreateHeap12 of an upload or readback heap with no `memory` makes a heap of native memory
and answers the handle `placed` that a placed host memory request of the guest takes the mapping by, 0 when the guest
opens the memory first and CreateHeap12 names it."""
params = []
reply = ["u32 placed"]

[[command]]
name = "CreateHeap12"
id = 0x1100
doc = """A heap of `size` bytes. A heap of a CPU-visible type (upload, readback, or custom with a CPU page)
is the window of `size` bytes at `offset` in the host memory the guest opened and imported, named by the handle
IMPORT_BLOB answered as `memory`; the window lies inside that memory, and `offset` is a multiple of 64 KiB.
It can hold only buffers (docs/host-memory.md). The host keeps the memory's imported heap until the guest has
released the memory, every heap and resource in it is destroyed and the GPU is done with it. Any other heap is the
host GPU's own and memory and offset are ignored. The host keeps only the heap flags that name how
the heap may be used: a guest never reads memory it did not write. A heap of a CPU-visible type with `memory` 0,
asked of a host that answered QueryHeapPlacement12 with 1, is made of native host memory instead and `placed` names
it, the handle of the placed host memory request that maps it; `placed` is 0 for every other heap. hresult is
S_OK, or the host's own answer when it made no heap - E_OUTOFMEMORY when it has no memory for one."""
params = ["u32 heap", "HeapProperties properties", "u32 flags", "u64 size", "u64 alignment", "u64 memory", "u64 offset"]
reply = ["u32 hresult", "u64 placed"]

[[command]]
name = "CreateCommittedResource12"
id = 0x1101
doc = """A resource with a heap of its own on the host GPU. A buffer is found by `address` from then on.
hresult is S_OK, or the host's own answer when it made no resource - E_OUTOFMEMORY when it has no memory for one."""
params = ["u32 resource", "HeapProperties properties", "u32 heap_flags", "ResourceDesc desc", "u32 state",
          "ClearValue clear", "u64 address"]
reply = ["u32 hresult"]

[[command]]
name = "CreateHeapAsync12"
id = 0x1107
doc = """CreateHeap12 without an answer, for a guest that kept its own count of the device-local bytes it has committed
and found the heap well inside the host's budget. If the host makes no heap it notes the HRESULT against `heap`
and carries on: the guest learns of it only if it uses the heap, which a command naming a refused id does by
removing the device. Destroy12 of a refused id forgets it."""
params = ["u32 heap", "HeapProperties properties", "u32 flags", "u64 size", "u64 alignment", "u64 memory", "u64 offset"]

[[command]]
name = "CreateCommittedResourceAsync12"
id = 0x1108
doc = """CreateCommittedResource12 without an answer, under the same terms as CreateHeapAsync12: a refusal is noted
against `resource` and costs the device only if the resource is used."""
params = ["u32 resource", "HeapProperties properties", "u32 heap_flags", "ResourceDesc desc", "u32 state",
          "ClearValue clear", "u64 address"]

[[command]]
name = "ShareResource12"
id = 0x1104
doc = """`resource` - a committed 2D texture made with D3D12_HEAP_FLAG_SHARED, a swap chain buffer - shown to
the host GPU's Direct3D 11 device under `key`, the identity the miniport minted over its kernel allocation,
which the compositor opens it by. The same memory on both devices: nothing is copied."""
params = ["u32 resource", "u64 key"]

[[command]]
name = "CreatePlacedResource12"
id = 0x1102
doc = """A resource at `offset` in a heap made by CreateHeap12. A buffer is found by `address` from then on."""
params = ["u32 resource", "u32 heap", "u64 offset", "ResourceDesc desc", "u32 state", "ClearValue clear",
          "u64 address"]

[[command]]
name = "CreateReservedResource12"
id = 0x1105
doc = """A resource with no memory of its own: its 64 KiB tiles are mapped to heaps' by UpdateTileMappings12 on a
queue. A buffer is found by `address` from then on."""
params = ["u32 resource", "ResourceDesc desc", "u32 state", "ClearValue clear", "u64 address"]

[[command]]
name = "ResourceTiling12"
id = 0x1106
doc = """How a reserved resource is tiled on the host: every tile it has, and its packed mips - how many of its
smallest mips share tiles, and how many tiles they share. Zeros for any other resource."""
params = ["u32 resource"]
reply = ["u32 tiles", "u32 packed_mips", "u32 packed_tiles"]

[[command]]
name = "ResourceAllocation12"
id = 0x1103
doc = """How many bytes, at what alignment, a placed resource of `desc` takes in a heap: the host's answer, since
the host is where it will be placed. size is ~0 for a description the host would refuse."""
params = ["ResourceDesc desc"]
reply = ["u64 size", "u64 alignment"]

[[command]]
name = "CreateDescriptorHeap12"
id = 0x1200
params = ["u32 heap", "u32 type", "u32 count", "u32 flags"]

[[command]]
name = "CreateShaderResourceView12"
id = 0x1201
doc = """A view written at `at`. has_desc 0 is a null description: the resource's own format and whole extent."""
params = ["DescriptorRef at", "u32 has_desc", "ViewDesc desc"]

[[command]]
name = "CreateUnorderedAccessView12"
id = 0x1202
params = ["DescriptorRef at", "u32 has_desc", "ViewDesc desc"]

[[command]]
name = "CreateRenderTargetView12"
id = 0x1203
params = ["DescriptorRef at", "u32 has_desc", "ViewDesc desc"]

[[command]]
name = "CreateDepthStencilView12"
id = 0x1204
params = ["DescriptorRef at", "u32 has_desc", "ViewDesc desc"]

[[command]]
name = "CreateConstantBufferView12"
id = 0x1205
params = ["DescriptorRef at", "u64 address", "u32 size"]

[[command]]
name = "CreateSampler12"
id = 0x1206
params = ["DescriptorRef at", "SamplerDesc desc"]

[[command]]
name = "CopyDescriptors12"
id = 0x1207
doc = """`count` descriptors from `source` to `destination`, both of heaps of the same type."""
params = ["DescriptorRef destination", "DescriptorRef source", "u32 count"]

[[command]]
name = "CreateRootSignature12"
id = 0x1300
params = ["u32 root", "u32 flags", "u32 parameter_count", "RootParameter parameters[parameter_count] max 64",
          "u32 range_count", "DescriptorRange ranges[range_count] max 512", "u32 sampler_count",
          "StaticSampler samplers[sampler_count] max 64"]

[[command]]
name = "CreateCommandSignature12"
id = 0x1303
doc = """What ExecuteIndirect12 reads each command from: byte_stride bytes a command, laid out as the
arguments say. root is the root signature the arguments that set root parameters name, 0 for none. An argument
that carries a GPU address - a vertex or index buffer view, a constant buffer, shader resource or unordered access
view buffer - holds the guest's address, which the host translates on the GPU before ExecuteIndirect12 runs."""
params = ["u32 signature", "u32 root", "u32 byte_stride", "u32 argument_count",
          "IndirectArgument arguments[argument_count] max 16"]

[[command]]
name = "CreateGraphicsPipeline12"
id = 0x1301
doc = """A graphics pipeline state. Each stage's code is what the DDI gave the driver - a DXBC or DXIL
container, a DXIL program, or a DXBC token stream - and empty for a stage the pipeline does not have; the
signatures are every stage's, as registers. The input layout names vertex shader input registers. The
geometry shader's stream output declaration, if it has one, is stream_out with its buffer strides and the stream
that is rasterized (0xFFFFFFFF for none)."""
params = ["u32 pipeline", "u32 root", "GraphicsState state", "u32 element_count",
          "InputElement elements[element_count] max 32", "u32 signature_count",
          "SignatureEntry signatures[signature_count] max 1024", "u32 stream_out_count",
          "StreamOutDeclaration stream_out[stream_out_count] max 128", "u32 stride_count",
          "u32 strides[stride_count] max 4", "u32 rasterized_stream", "bytes vs", "bytes hs", "bytes ds", "bytes gs",
          "bytes ps", "bytes ms", "bytes as"]

[[command]]
name = "CreateComputePipeline12"
id = 0x1302
params = ["u32 pipeline", "u32 root", "bytes cs"]

[[command]]
name = "CreateCommandQueue12"
id = 0x1400
params = ["u32 queue", "u32 type", "u32 priority", "u32 flags"]

[[command]]
name = "CreateCommandAllocator12"
id = 0x1401
