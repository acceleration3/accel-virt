params = ["u32 list", "u32 heap", "u32 type", "u32 first", "u32 count", "u32 destination", "u64 offset"]

[[command]]
name = "BeginEvent12"
id = 0x151c
doc = "PIX's event encoding: metadata says what `data` is."
params = ["u32 list", "u32 metadata", "bytes data"]

[[command]]
name = "EndEvent12"
id = 0x151d
params = ["u32 list"]

[[command]]
name = "SetMarker12"
id = 0x151e
params = ["u32 list", "u32 metadata", "bytes data"]

[[command]]
name = "ExecuteIndirect12"
id = 0x151f
doc = """Up to max_count commands of the signature, read from argument_buffer at argument_offset; with a
count_buffer (0 for none), as many as the u32 at count_offset says, if fewer."""
params = ["u32 list", "u32 signature", "u32 max_count", "u32 argument_buffer", "u64 argument_offset",
          "u32 count_buffer", "u64 count_offset"]

[[command]]
name = "CopyTiles12"
id = 0x1520
doc = """Copies a region of a reserved resource's tiles to `buffer` at `buffer_offset`, 64 KiB a tile in the
region's order - or from it, when flags has D3D12_TILE_COPY_FLAG_LINEAR_BUFFER_TO_SWIZZLED_TILED_RESOURCE."""
params = ["u32 list", "u32 resource", "TileCoordinate start", "TileSize size", "u32 buffer", "u64 buffer_offset",
          "u32 flags"]

[[command]]
name = "ResolveSubresourceRegion12"
id = 0x1521
doc = """ResolveSubresource12 into a region of the destination: the source's `rect` (the whole subresource when
has_rect is 0) lands at `x`, `y`, combined by `mode` (D3D12_RESOLVE_MODE)."""
params = ["u32 list", "u32 destination", "u32 destination_subresource", "u32 x", "u32 y", "u32 source",
          "u32 source_subresource", "u32 has_rect", "Rect rect", "u32 format", "u32 mode"]

[[command]]
name = "SetSamplePositions12"
id = 0x1522
doc = """The positions of `samples` samples in each of `pixels` pixels, samples * pixels of them, for the draws after."""
params = ["u32 list", "u32 samples", "u32 pixels", "u32 count", "SamplePosition positions[count] max 64"]

[[command]]
name = "WriteBufferImmediate12"
id = 0x1523
doc = """Each write stores `value` at `address` in order; mode is D3D12_WRITEBUFFERIMMEDIATE_MODE."""
params = ["u32 list", "u32 count", "ImmediateWrite writes[count] max 64"]

[[command]]
name = "SetViewInstanceMask12"
id = 0x1524
params = ["u32 list", "u32 mask"]

[[command]]
name = "GetClockOrigin12"
id = 0x1525
doc = """The host GPU's timestamp counter now and its rate in ticks a second, both 0 when the queue's host cannot
answer. The caller times the exchange against its own clock and hands the pair to the kernel driver as the origin
the timestamp calibration counts from."""
params = ["u32 queue"]
reply = ["u64 ticks", "u64 frequency"]

[[command]]
name = "SetDepthBounds12"
id = 0x1526
doc = "The depth range a pixel's stored depth must lie in for the draws after; both within 0 to 1."
params = ["u32 list", "f32 minimum", "f32 maximum"]

[[command]]
name = "SetFrontAndBackStencilRef12"
id = 0x1530
doc = "The stencil reference of front-facing and of back-facing triangles for the draws after."
params = ["u32 list", "u32 front", "u32 back"]

[[command]]
name = "SetPredication12"
id = 0x1527
doc = """Draws and dispatches after are skipped by the 64-bit value at `offset` in `buffer`: zero skips when op is
D3D12_PREDICATION_OP_NOT_EQUAL_ZERO, non-zero when it is EQUAL_ZERO. buffer 0 turns predication off."""
params = ["u32 list", "u32 buffer", "u64 offset", "u32 op"]

[[command]]
name = "SetStreamOutputTargets12"
id = 0x1528
doc = "Binds `count` stream output buffers from slot `start`; an address of 0 unbinds its slot."
params = ["u32 list", "u32 start", "u32 count", "StreamOutputView views[count] max 4"]

[[command]]
name = "ClearUnorderedAccessViewUint12"
id = 0x1529
doc = """Fills the unordered access view `gpu_view` (a slot of a shader-visible heap, `cpu_view` its copy in a
CPU-only heap) of `resource` with `values`, within the rectangles or whole when there are none."""
params = ["u32 list", "DescriptorRef gpu_view", "DescriptorRef cpu_view", "u32 resource", "Uint4 values",
          "u32 rect_count", "Rect rects[rect_count] max 16"]

[[command]]
name = "ClearUnorderedAccessViewFloat12"
id = 0x152a
doc = "ClearUnorderedAccessViewUint12 with a float value."
params = ["u32 list", "DescriptorRef gpu_view", "DescriptorRef cpu_view", "u32 resource", "Float4 values",
          "u32 rect_count", "Rect rects[rect_count] max 16"]

[[command]]
name = "ExecuteBundle12"
id = 0x152b
doc = """Plays the closed bundle `bundle` inside the recording `list`; the list keeps alive what the bundle recorded.
A bundle cannot play a bundle."""
params = ["u32 list", "u32 bundle"]
