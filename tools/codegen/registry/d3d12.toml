[[command]]
name = "ExecuteCommandLists12"
id = 0x1407
params = ["u32 queue", "u32 count", "u32 lists[count] max 64"]

[[command]]
name = "PresentResource12"
id = 0x140d
doc = """`resource`, shared by ShareResource12, is presented from `queue`, the `point`th present of it: what the
queue executed before is done on the GPU before the host's Direct3D 11 device runs anything it is given after.
Where a blt-model present has read this surface before, the host stages the frame on `queue` here, which the
present engine reads by the surface's shared id and `point` (docs/shared-surfaces.md); a point of 0 stages
nothing."""
params = ["u32 queue", "u32 resource", "u32 point"]

[[command]]
name = "UpdateTileMappings12"
id = 0x140e
doc = """Maps the tiles of `regions` of a reserved resource, in order, to the heap tiles `ranges` name, in order,
on `queue` - between the work executed on it before and after. heap is 0 when every range unmaps or skips. A
call the guest made with more regions or ranges than one command carries crosses as several, in order."""
params = ["u32 queue", "u32 resource", "u32 region_count", "TileRegion regions[region_count] max 2048", "u32 heap",
          "u32 range_count", "TileRange ranges[range_count] max 2048", "u32 flags"]

[[command]]
name = "CopyTileMappings12"
id = 0x140f
doc = """Maps the tiles of a region of `destination` to whatever the same-sized region of `source` from
`source_start` is mapped to, on `queue`."""
params = ["u32 queue", "u32 destination", "TileCoordinate destination_start", "u32 source",
          "TileCoordinate source_start", "TileSize size", "u32 flags"]

[[command]]
name = "CreateQueryHeap12"
id = 0x140c
params = ["u32 heap", "u32 type", "u32 count"]

[[command]]
name = "ResourceBarrier12"
id = 0x1500
params = ["u32 list", "u32 count", "Barrier barriers[count] max 128"]

